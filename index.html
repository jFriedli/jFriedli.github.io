<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonas Benjamin Friedli</title>
  <!-- Load the shared CRT theme -->
  <link rel="stylesheet" href="crt.css" />
</head>
<body>
  <!-- Background grid plane removed to simplify the layout -->
  <div class="screen-wrap rgb-bleed">
    <!-- Hero section with animated prompt and socials -->
    <section class="hero">
      <div class="prompt">jonas@home ~ $ ./welcome.sh</div>
      <h1>Jonas Benjamin Friedli</h1>
      <div class="socials" aria-label="links">
        <a href="https://www.linkedin.com/in/jonas-benjamin-friedli/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/jFriedli" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.exploit-db.com/?author=12089" target="_blank" rel="noopener">Exploit-DB</a>
        <a href="https://www.wordfence.com/threat-intel/vulnerabilities/researchers/jonas-benjamin-friedli" target="_blank" rel="noopener">Wordfence</a>
        <a href="https://www.kaggle.com/jbfriedli" target="_blank" rel="noopener">Kaggle</a>
        <a href="https://medium.com/@jonas.friedli" target="_blank" rel="noopener">Medium</a>
        <a href="https://li.sten.to/8beznzex" target="_blank" rel="noopener">Music</a>
      </div>

      <!-- NEW: centered chat button under the links -->
      <div class="hero-actions">
        <a href="/chat" class="chat-btn">Chat (LLM)</a>
        <a href="/labs/" class="chat-btn">Labs</a>
      </div>

      <div class="scroll-down"><span class="cursor"></span></div>
    </section>

    <div class="content">
      <!-- CVE table card -->
      <div class="term-card" id="cve-card">
        <div class="term-header">
          <div class="leds"><span class="led"></span><span class="led"></span><span class="led"></span></div>
          CVEs
          <div class="term-meta" id="cve-count"></div>
          <a class="analytics-btn" href="/analytics">Analytics</a>
        </div>
        <div class="table-wrap">
          <div class="table-inner">
            <table id="cve-table">
              <thead>
                <tr>
                  <th class="sortable" data-type="cve">ID</th>
                  <th class="sortable" data-type="string">Software</th>
                  <th class="sortable" data-type="string">CWE</th>
                  <th class="sortable" data-type="number">Score</th>
                  <th class="sortable" data-type="string">Severity</th>
                  <th data-type="string">Reference</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- CTF table card -->
      <div class="term-card" id="ctf-card">
        <div class="term-header">
          <div class="leds"><span class="led"></span><span class="led"></span><span class="led"></span></div>
          CTF Boxes I built
        </div>
        <div class="table-wrap">
          <div class="table-inner">
            <table id="ctf-table">
              <thead>
                <tr>
                  <th class="sortable" data-type="string">Name</th>
                  <th class="sortable" data-type="string">Company</th>
                  <th data-type="string">Reference</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- CRT overlay on top of all content -->
  <div class="crt"></div>
  <!-- Load table parsing and sorting logic -->
  <script src="main.js"></script>
</body>
</html>
