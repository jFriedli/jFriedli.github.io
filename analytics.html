<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVE Analytics • Jonas Benjamin Friedli</title>
  <!-- Shared CRT theme for both pages -->
  <link rel="stylesheet" href="crt.css" />
</head>
<body>
  <!-- Background grid plane removed to simplify the layout -->
  <div class="screen-wrap rgb-bleed">
    <div class="content">
      <!-- Analytics card containing charts and lists -->
      <div class="term-card">
        <div class="term-header">
          <div class="leds"><span class="led"></span><span class="led"></span><span class="led"></span></div>
          CVE Analytics
          <div class="term-meta" id="dataset-meta"></div>
          <a class="analytics-btn" href="/">Home</a>
        </div>
        <!-- Single row: Ratings heat map and Top CWEs side by side -->
        <div class="split">
          <div class="split-item heatmap-box">
            <h3>Common Vulnerability Scoring System Radar</h3>
            <canvas id="heatmapCanvas"></canvas>
            <h3>Severity distribution</h3>
            <!-- Severity distribution rendered as a 3D torus on a single canvas. -->
            <div class="spin-container">
              <!-- Canvas for the rotating 3D donut.  Its resolution is set via
                   JavaScript and it scales to fill the available space. -->
              <canvas id="severityTorus" class="donut-canvas"></canvas>
            </div>
            <div id="sevLegend" class="legend"></div>
          </div>
          <div class="split-item">
            <h3>Top CWEs</h3>
            <div id="cweList" class="ranked-list" aria-live="polite"></div>
          </div>
        </div>
        <!-- Error display placeholder -->
        <div id="loadError" class="error" role="alert"></div>
      </div>
    </div>
  </div>
  <!-- CRT overlay to create glow and scanline effects -->
  <div class="crt"></div>
  <!-- Common parsing utilities and analytics dashboard script -->
  <script src="main.js"></script>
  <script src="analytics.js"></script>
</body>
</html>
