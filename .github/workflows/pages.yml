name: Build and deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            labs-src/cloth-simulation
            labs-src/fluid-simulation
            labs-src/path-tracing
            labs-src/open-ebus-lab
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            labs-src/cloth-simulation/web/package-lock.json
            labs-src/fluid-simulation/web/package-lock.json
            labs-src/path-tracing/web/package-lock.json
            labs-src/open-ebus-lab/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - run: ./scripts/build-site.sh
      - name: Validate Pages artifact
        run: |
          test -f _site/CNAME
          grep -qx 'jfriedli.com' _site/CNAME
          test -f _site/index.html
          test -f _site/labs/index.html
          test -f _site/labs/cloth-simulation/index.html
          test -f _site/labs/fluid-simulation/index.html
          test -f _site/labs/path-tracing/index.html
          test -f _site/labs/open-ebus-lab/index.html
          test -f _site/labs/open-ebus-lab-card.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
